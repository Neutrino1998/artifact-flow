# Mode 1: Quick Trial — backend + frontend, SQLite + InMemory
# Usage: docker compose up

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: artifactflow:latest
    container_name: artifactflow-backend
    ports:
      - "8000:8000"
    volumes:
      - artifactflow_data:/app/data
      - ./config:/app/config:ro
      - ./config/site:/app/site-config:rw
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - ARTIFACTFLOW_SITE_CONFIG_DIR=/app/site-config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 10s
      start_period: 5s
      retries: 3
    # SYS_PTRACE: backup attach path (`docker exec backend py-spy dump --pid 1`).
    # Container-scope capability — only ptrace within this container's PID ns.
    # See deploy/compose.base.yml for the full production rationale.
    cap_add:
      - SYS_PTRACE
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    image: artifactflow-frontend:latest
    container_name: artifactflow-frontend
    ports:
      - "3000:3000"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./config/site:/app/public/site:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  artifactflow_data:
