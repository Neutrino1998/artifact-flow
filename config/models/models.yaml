# 采样参数策略:不在这一层设全局默认。每个模型如需特定 temperature/top_p/...
# 在该模型 params 里显式声明;未声明的参数交给 provider/模型默认决定(OpenAI/DeepSeek
# 默认 1.0、vLLM 用 max_model_len 兜 max_tokens 等)。详见 src/models/llm.py 注释。

# 模型配置（内网部署：GPUStack OpenAI-compatible API @ https://172.25.16.129:86/v1）
# 后端推理服务需回填 reasoning_content；thinking 通过
# extra_body.chat_template_kwargs.thinking 切换（V3.1 系默认关）。
models:
  # 温度 0.8 = DeepSeek 官方推荐 1.0 与 agent/XML 工具调用稳定性的折中。
  # 之前两条用 0.6/0.7 是从 Qwen3.6 preset 不假思索抄来的 —— Qwen 那套 RL 训练评测
  # 用低温,DeepSeek V3.x 官方推荐对称 1.0(thinking 和 non-thinking 共享同一组采样
  # 参数),没有 thinking-需要-低温 这个差异。两边对称,后续做评测才有干净的对照。
  文本模型:
    model: openai/deepseek-v4-flash
    context_window: 220000
    base_url: https://172.25.16.129:86/v1
    api_key_env: GPUSTACK_DEEPSEEK_API_KEY
    cache_salt_field: cache_salt
    params:
      temperature: 0.8
      top_p: 0.95
      extra_body:
        chat_template_kwargs:
          thinking: true

  deepseek-v4-flash-no-thinking:
    model: openai/deepseek-v4-flash
    context_window: 260000
    base_url: https://172.25.16.129:86/v1
    api_key_env: GPUSTACK_DEEPSEEK_API_KEY
    cache_salt_field: cache_salt
    params:
      temperature: 0.8
      top_p: 0.95
      extra_body:
        chat_template_kwargs:
          thinking: false

  视觉模型:
    model: openai/qwen3.6-27b
    context_window: 128000
    base_url: http://172.22.3.54/v1
    api_key_env: GPUSTACK_VISION_API_KEY
    cache_salt_field: cache_salt
    vision: true

