site_name: ArtifactFlow
site_description: 面向私有化部署的可配置多智能体服务
site_url: https://neutrino1998.github.io/artifact-flow/
repo_url: https://github.com/Neutrino1998/artifact-flow
repo_name: Neutrino1998/artifact-flow

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

exclude_docs: |
  _archive/

plugins:
  - search

markdown_extensions:
  - toc:
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - admonition
  - pymdownx.details
  - tables

nav:
  - 首页: index.md
  - 产品使用指南: product-guide.md
  - 工作原理: how-it-works.md
  - PAT 与 API 调用: personal-access-tokens.md
  - 配置:
      - 配置总览: configuration/index.md
      - Model: configuration/models.md
      - Agent: configuration/agents.md
      - Tool 与 MCP: configuration/tools.md
      - Skill: configuration/skills.md
      - 企业认证: configuration/authentication.md
      - 应用与站点: configuration/runtime.md
  - 部署与运维:
      - 主机准备: operations/host-preparation.md
      - 首次部署: operations/first-deployment.md
      - Release 与升级: operations/releases.md
      - 日常维护: operations/maintenance.md
      - 故障处理: operations/troubleshooting.md
